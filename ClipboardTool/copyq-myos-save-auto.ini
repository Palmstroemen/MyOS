[Command]
Name=MyOS | Auto-Save Clipboard to MD
Automatic=true
Input=text/plain
Filter=copyq: if (hasClipboardFormat('text/uri-list')) fail();
Command=copyq:
var scriptPath = str(env('MYOS_CLIPBOARD_TOOL_SCRIPT'));
if (!scriptPath) scriptPath = str(env('HOME')) + '/Dokumente/MyOS/ClipboardTool/save_clip_to_myos.py';
var text = str(data(mimeText));
if (!text) abort();
var result = execute('python3', scriptPath, null, text);
if (result.exitCode !== 0) popup('MyOS Clipboard', 'Save failed: ' + scriptPath);
Icon=\xf0c5
