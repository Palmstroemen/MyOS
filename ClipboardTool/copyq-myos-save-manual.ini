[Command]
Name=MyOS | Save to Clipboard (MD file)
In Menu=true
Input=text/plain
Command=copyq:
var scriptPath = str(env('MYOS_CLIPBOARD_TOOL_SCRIPT'));
if (!scriptPath) scriptPath = str(env('HOME')) + '/Dokumente/MyOS/ClipboardTool/save_clip_to_myos.py';
var items = selectedItemsData();
var count = 0;
for (var i = 0; i < items.length; i++) {
  var text = items[i][mimeText];
  if (text && str(text).trim()) {
    var result = execute('python3', scriptPath, null, str(text));
    if (result.exitCode === 0) count++;
  }
}
if (count === 0) popup('MyOS Clipboard', 'No text in selection.');
else { var dir = str(env('MYOS_CLIPBOARD_PATH')); if (!dir) dir = '~/Clipboard'; popup('MyOS Clipboard', 'Saved ' + count + ' clip(s) to ' + dir); }
Icon=\xf0c5
