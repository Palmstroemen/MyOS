<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- X-ray: a framed film with spine, ribs and pelvis, so it does not look like the folders
       button; it fills its button (Scope's side buttons are their icons). -->
  <rect id="film" x="1.5" y="1.5" width="45" height="45" rx="4" fill="#1d2a3a" stroke="#7fa3c8" stroke-width="2"/>
  <g fill="none" stroke="#dff1ff" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M24 6v25" stroke-width="2.4"/>
    <g stroke-width="2.2">
      <path d="M22.5 10c-5 0-9 1.5-11.5 5"/>
      <path d="M25.5 10c5 0 9 1.5 11.5 5"/>
      <path d="M22.5 15c-5 0-8.5 1.5-10.5 4.5"/>
      <path d="M25.5 15c5 0 8.5 1.5 10.5 4.5"/>
      <path d="M22.5 20c-4 0-7 1.3-8.5 3.8"/>
      <path d="M25.5 20c4 0 7 1.3 8.5 3.8"/>
    </g>
    <g id="pelvis" stroke-width="2">
      <!-- the iliac wings flaring out from the sacrum, below them the two hip holes -->
      <path d="M22.5 31.5c-1.5-2.5-6-4-10-2.5c-1 2.5 0 6.5 3 8.5c2 1.3 4.5 1.5 6.5 0.5"/>
      <path d="M25.5 31.5c1.5-2.5 6-4 10-2.5c1 2.5 0 6.5-3 8.5c-2 1.3-4.5 1.5-6.5 0.5"/>
      <path d="M22.5 31.5l1.5 6l1.5-6"/>
      <ellipse cx="19" cy="41.5" rx="2.8" ry="2.2"/>
      <ellipse cx="29" cy="41.5" rx="2.8" ry="2.2"/>
    </g>
  </g>
  <circle cx="24" cy="6" r="1.8" fill="#dff1ff"/>
</svg>
